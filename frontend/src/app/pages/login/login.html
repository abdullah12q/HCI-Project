<div
  class="flex items-center justify-center min-h-screen bg-linear-to-br from-blue-50 to-indigo-100 p-4"
>
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
    <div class="bg-blue-600 p-8 text-center">
      <div
        class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-500 mb-4 shadow-inner"
      >
        <i class="pi pi-wallet text-white text-3xl"></i>
      </div>
      <h2 class="text-3xl font-bold text-white tracking-tight">Welcome Back</h2>
      <p class="text-blue-100 mt-2">Sign in to manage your budget</p>
    </div>

    <div class="p-8">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
        <div class="flex flex-col gap-2">
          <label for="email" class="text-sm font-semibold text-gray-700">Email Address</label>

          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="Enter your email"
            class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />

          @if (loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
          <small class="text-red-500">Please enter a valid email.</small>
          }
        </div>

        <div class="flex flex-col gap-2">
          <label for="password" class="text-sm font-semibold text-gray-700">Password</label>

          <div class="relative">
            <input
              type="password"
              id="password"
              formControlName="password"
              placeholder="••••••••"
              class="w-full border rounded-lg pl-3 pr-12 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
            />
          </div>

          @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
          <small class="text-red-500">Password is required.</small>
          }
        </div>

        <button
          type="submit"
          [disabled]="loginForm.invalid || isLoading()"
          class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (isLoading()) { <span>Loading...</span> } @else { <span>Sign In</span> }
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-gray-100 text-center">
        <p class="text-gray-600">
          Don't have an account?
          <a routerLink="/register" class="text-blue-600 font-bold hover:underline">
            Create one now
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
