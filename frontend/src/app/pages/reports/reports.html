<div class="p-6 max-w-7xl mx-auto">
  <div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-800">Financial Reports</h1>
    <p class="text-gray-500">Analyze your income, spending habits, and savings.</p>
  </div>

  <div class="bg-white rounded-xl shadow-lg overflow-hidden">
    <p-tabs value="0">
      <p-tablist>
        <p-tab value="0">Income vs Expense</p-tab>
        <p-tab value="1" class="mx-8">Budget Variance</p-tab>
        <p-tab value="2">Savings Progress</p-tab>
      </p-tablist>

      <p-tabpanels>
        <p-tabpanel value="0">
          <div class="p-4">
            <h3 class="text-lg font-bold text-gray-700 mb-4">Cash Flow Analysis</h3>
            <div class="h-[400px]">
              <p-chart
                type="bar"
                [data]="incomeExpenseData"
                [options]="chartOptions"
                height="100%"
              />
            </div>
          </div>
        </p-tabpanel>

        <p-tabpanel value="1">
          <div class="p-4">
            <h3 class="text-lg font-bold text-gray-700 mb-4">Planned vs. Actual Spending</h3>
            <p class="text-sm text-gray-500 mb-4">
              Bars in <span class="text-red-500 font-bold">Red</span> indicate overspending.
              <span class="text-green-500 font-bold">Green</span> indicates within budget.
            </p>
            <div class="h-[400px]">
              <p-chart
                type="bar"
                [data]="budgetVarianceData"
                [options]="chartOptions"
                height="100%"
              />
            </div>
          </div>
        </p-tabpanel>

        <p-tabpanel value="2">
          <div class="p-4">
            <h3 class="text-lg font-bold text-gray-700 mb-4">Goal Completion Status</h3>
            <div class="h-[400px]">
              <p-chart
                type="bar"
                [data]="savingsProgressData"
                [options]="{
                  maintainAspectRatio: false,
                  plugins: { legend: { labels: { color: '#4b5563' } } },
                  scales: { x: { stacked: true }, y: { stacked: true } }
                }"
                height="100%"
              />
            </div>
          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </div>
</div>
