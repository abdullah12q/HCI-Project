@if (!authService.currentUser()) {
<router-outlet></router-outlet>
} @else {
<div class="flex h-screen bg-gray-50 font-sans overflow-hidden">
  <aside
    class="bg-white w-64 shadow-2xl flex flex-col transition-all duration-300 ease-in-out z-30"
  >
    <div class="h-20 flex items-center justify-center border-b border-gray-200">
      <div class="flex items-center gap-2">
        <div class="bg-blue-600 p-2 rounded-lg">
          <i class="pi pi-wallet text-white text-xl"></i>
        </div>
        <span class="text-xl font-bold text-gray-800 tracking-tight"
          >Budget<span class="text-blue-600">Tracker</span></span
        >
      </div>
    </div>

    <nav class="flex-1 overflow-y-auto py-6 px-3">
      <ul class="space-y-2">
        <li>
          <a
            routerLink="/dashboard"
            routerLinkActive="bg-blue-50 text-blue-600 font-semibold"
            class="flex items-center px-4 py-3 text-gray-600 rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-all cursor-pointer no-underline group"
          >
            <i class="pi pi-home mr-3 text-lg group-hover:text-blue-600"></i>
            <span>Dashboard</span>
          </a>
        </li>

        <li>
          <a
            routerLink="/budgets"
            routerLinkActive="bg-cyan-50 text-cyan-600 font-semibold"
            class="flex items-center px-4 py-3 text-gray-600 rounded-xl hover:bg-cyan-50 hover:text-cyan-600 transition-all cursor-pointer no-underline group"
          >
            <i class="pi pi-sliders-h mr-3 text-lg group-hover:text-cyan-600"></i>
            <span>Budgets</span>
          </a>
        </li>

        <li>
          <a
            routerLink="/expenses"
            routerLinkActive="bg-red-50 text-red-600 font-semibold"
            class="flex items-center px-4 py-3 text-gray-600 rounded-xl hover:bg-red-50 hover:text-red-600 transition-all cursor-pointer no-underline group"
          >
            <i class="pi pi-credit-card mr-3 text-lg group-hover:text-red-600"></i>
            <span>Expenses</span>
          </a>
        </li>

        <li>
          <a
            routerLink="/income"
            routerLinkActive="bg-green-50 text-green-600 font-semibold"
            class="flex items-center px-4 py-3 text-gray-600 rounded-xl hover:bg-green-50 hover:text-green-600 transition-all cursor-pointer no-underline group"
          >
            <i class="pi pi-dollar mr-3 text-lg group-hover:text-green-600"></i>
            <span>Income</span>
          </a>
        </li>

        <li>
          <a
            routerLink="/goals"
            routerLinkActive="bg-purple-50 text-purple-600 font-semibold"
            class="flex items-center px-4 py-3 text-gray-600 rounded-xl hover:bg-purple-50 hover:text-purple-600 transition-all cursor-pointer no-underline group"
          >
            <i class="pi pi-flag mr-3 text-lg group-hover:text-purple-600"></i>
            <span>Goals</span>
          </a>
        </li>

        <li>
          <a
            routerLink="/reports"
            routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
            class="flex items-center px-4 py-3 text-gray-600 rounded-xl hover:bg-indigo-50 hover:text-indigo-600 transition-all cursor-pointer no-underline group"
          >
            <i class="pi pi-chart-bar mr-3 text-lg group-hover:text-indigo-600"></i>
            <span>Reports</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="p-4 border-t border-gray-200">
      <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-xl">
        <div
          class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-lg border-2 border-white shadow-sm"
        >
          {{ authService.currentUser()?.email?.charAt(0)?.toUpperCase() }}
        </div>
        <div class="overflow-hidden">
          <p class="text-sm font-bold text-gray-800 m-0 truncate">
            {{ authService.currentUser()?.email }}
          </p>
          <p class="text-xs text-green-500 font-medium m-0 flex items-center gap-1">
            <span class="block w-2 h-2 rounded-full bg-green-500"></span> Online
          </p>
        </div>
      </div>
    </div>
  </aside>

  <main class="flex-1 flex flex-col min-w-0 overflow-hidden relative">
    <header class="h-20 bg-white shadow-sm flex items-center justify-end px-8 z-20">
      <div>
        <button
          (click)="authService.logout()"
          class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-red-600 bg-red-50 rounded-lg hover:bg-red-100 hover:text-red-700 transition-all cursor-pointer"
        >
          <i class="pi pi-sign-out"></i>
          <span>Logout</span>
        </button>
      </div>
    </header>

    <div class="flex-1 overflow-auto bg-gray-50 relative p-4 scroll-smooth">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
}
